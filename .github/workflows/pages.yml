name: Publish Chinese trainer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('public')
          prefix = '/my-chinese-app/'
          assets = tuple(p.name + ('/' if p.is_dir() else '') for p in root.iterdir())
          for path in root.rglob('*'):
              if path.suffix not in ('.html','.js','.css','.webmanifest'):
                  continue
              s = path.read_text(encoding='utf-8')
              for asset in assets:
                  s = s.replace('"/' + asset, '"' + prefix + asset).replace("'/" + asset, "'" + prefix + asset)
              path.write_text(s, encoding='utf-8')
          # GitHub Pages has no /api/sync. Keep progress in the browser.
          (root / 'cloud.js').write_text("""(function(){
          const localStatus='Локально на этом устройстве · делай экспорт JSON';
          window.ChineseCloud={
            async start(local){return local;},
            schedule(){},
            async sync(){},
            getStatus(){return localStatus;},
            isOnline(){return false;},
            refreshStatus(){document.querySelectorAll('[data-sync-status]').forEach(el=>el.textContent=localStatus);}
          };
          })();""",encoding='utf-8')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('Войди через тот же аккаунт ChatGPT, что и на компьютере. Прогресс, правки и новые материалы сохраняются в аккаунте.', 'Прогресс, правки и новые материалы сохраняются в этом браузере. Для переноса на другое устройство используй экспорт и импорт JSON.')
          html = html.replace('Для запуска и обмена изменениями нужно подключение к интернету. При потере связи изменения сохраняются на устройстве и отправляются после подключения.', 'Для загрузки сайта нужно подключение к интернету. Регулярно сохраняй резервную копию через экспорт JSON в разделе «Источники и перенос».')
          index.write_text(html, encoding='utf-8')
          app = root / 'app.js'
          app.write_text(app.read_text(encoding='utf-8').replace('Рисунки и счёт сохраняются в аккаунте при синхронизации.', 'Рисунки и счёт сохраняются в этом браузере.'), encoding='utf-8')
          (root / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
